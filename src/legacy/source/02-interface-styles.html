
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Montserrat',sans-serif;background:#F4F4F5}
input,select,textarea,button{font-family:'Montserrat',sans-serif}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
#gm-hamburger{display:none}
@media (max-width:1100px){
  #main-content [style*="display:grid"]>*{min-width:0!important;}
  #main-content [style*="grid-template-columns:repeat(4"]{grid-template-columns:repeat(2,minmax(0,1fr))!important;}
  #main-content [style*="grid-template-columns:repeat(3"]{grid-template-columns:repeat(3,minmax(0,1fr))!important;}
  #main-content [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;}
  #main-content [style*="grid-template-columns:1fr 264px"]{grid-template-columns:minmax(0,1fr)!important;}
  #main-content [style*="min-width:130px"]{min-width:0!important;}
  #main-content div:has(> table){overflow-x:auto!important;-webkit-overflow-scrolling:touch;}
}
@media (max-width:860px){
  #gm-sidebar{position:fixed!important;top:0;left:0;height:100vh!important;z-index:2000;transform:translateX(-100%);transition:transform .25s ease;box-shadow:6px 0 28px rgba(0,0,0,.35);}
  #gm-sidebar.gm-open{transform:translateX(0);}
  #gm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1999;}
  #gm-overlay.gm-open{display:block;}
  #gm-hamburger{display:flex!important;}
  #main-content{padding:14px!important;}
  [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr!important;}
  [style*="grid-template-columns:repeat(3"]{grid-template-columns:repeat(2,1fr)!important;}
  [style*="grid-template-columns:repeat(4"]{grid-template-columns:repeat(2,1fr)!important;}
  [style*="grid-template-columns:1fr 264px"]{grid-template-columns:1fr!important;}
  #modal-box{width:92%!important;max-width:none!important;padding:20px 16px!important;max-height:88vh!important;overflow-y:auto!important;}
  #ai-panel{width:100vw!important;height:100dvh!important;top:0!important;left:0!important;right:0!important;bottom:0!important;border-radius:0!important;}
  #ai-btn{bottom:20px!important;right:20px!important;}
  #ai-input{font-size:16px!important;}
  #ai-panel>div:first-child{padding-top:calc(14px + env(safe-area-inset-top))!important;}
  #ai-panel>div:last-child{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important;}

  /* grids nunca estouram a largura */
  #main-content [style*="grid-template-columns:repeat(4"],#main-content [style*="grid-template-columns:repeat(3"]{grid-template-columns:repeat(2,minmax(0,1fr))!important;}
  #main-content [style*="grid-template-columns:1fr 1fr"],#main-content [style*="grid-template-columns:1fr 264px"]{grid-template-columns:minmax(0,1fr)!important;}
  #main-content [style*="display:grid"]>*{min-width:0!important;}
  #modal-box [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;}
  #modal-box [style*="display:grid"]>*{min-width:0!important;}

  /* cards de indicador mais compactos */
  .gm-kpi{padding:12px!important;gap:9px!important;}
  .gm-kpi>div:first-child{width:34px!important;height:34px!important;font-size:16px!important;border-radius:9px!important;}
  .gm-kpi>div:last-child{min-width:0!important;}
  .gm-kpi>div:last-child>div:nth-child(2){font-size:17px!important;overflow-wrap:anywhere;}

  /* faixas de totais: quebram em vez de cortar */
  #main-content [style*="display:flex"][style*="gap:12px"]{flex-wrap:wrap!important;}
  #main-content [style*="min-width:130px"]{min-width:0!important;flex:1 1 calc(50% - 6px)!important;padding:11px 13px!important;}
  #main-content [style*="min-width:130px"] [style*="font-size:20px"]{font-size:17px!important;overflow-wrap:anywhere;}

  /* TABELAS -> lista de cartões (sem rolagem horizontal) */
  .gm-tw,#main-content [style*="overflow-x:auto"]{overflow-x:visible!important;}
  #main-content table,#modal-box table{min-width:0!important;width:100%!important;display:block!important;}
  #main-content thead,#modal-box thead{display:none!important;}
  #main-content tbody,#modal-box tbody{display:block!important;}
  #main-content tbody tr,#modal-box tbody tr{display:block!important;border:1px solid #EFEFEF!important;border-radius:11px;background:#fff;padding:7px 11px;margin:8px 10px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  #main-content tbody td,#modal-box tbody td{display:flex!important;align-items:center;justify-content:space-between;gap:12px;width:auto!important;text-align:right!important;padding:6px 0!important;border:none!important;border-bottom:1px solid #F7F7F7!important;white-space:normal!important;overflow-wrap:anywhere;}
  #main-content tbody td:last-child,#modal-box tbody td:last-child{border-bottom:none!important;}
  #main-content tbody td::before,#modal-box tbody td::before{content:attr(data-l);flex:0 0 40%;text-align:left;font-size:9px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.7px;line-height:1.3;}
  #main-content tbody td:not([data-l]),#modal-box tbody td:not([data-l]){justify-content:center;}
  #main-content tbody td:not([data-l])::before,#modal-box tbody td:not([data-l])::before{display:none;}
  #main-content tbody td>div,#modal-box tbody td>div{justify-content:flex-end!important;flex-wrap:wrap;}
  #main-content tbody td[data-l]:empty::after{content:'—';color:#D1D5DB;}
  #main-content tbody td button{min-height:34px!important;}
  #main-content{padding-bottom:calc(88px + env(safe-area-inset-bottom))!important;}
}
@media (min-width:861px){
  #gm-hamburger{display:none!important;}
  #gm-overlay{display:none!important;}
}
.gm-tw{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.gm-tw table{min-width:640px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:#FFC107!important;box-shadow:0 0 0 3px rgba(255,193,7,.12)!important}
</style>
</helmet>
