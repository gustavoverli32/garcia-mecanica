name: Validate bundle

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test contracts and service-order flow
        run: npm test
      - name: Typecheck modular app
        run: npm run typecheck
      - name: Verify original source against published bundle
        run: npm run check:original
      - name: Build original app
        run: npm run build
      - name: Verify original source after build
        run: npm run check:original
      - name: Protect approved site bundle
        run: npm run check:published
      - name: Validate exported bundle
        shell: pwsh
        run: ./scripts/validate-bundle.ps1
      - name: Verify extracted template
        run: npm run verify:template
